; Weather + train departure board
; Panel : Good Display GDEM102F91 - 10.2", 960x640, 4-colour (black/white/red/yellow), SSD2677
; Board : Good Display ESP32 demo kit (DESPI-C02 adapter + ESP32)
;
; The panel is driven by GxEPD2's GDEY116F51 class: that is the 11.6" member of the same
; family - identical 960x640 grid, identical SSD2677 controller - and its init sequence takes
; resolution from WIDTH/HEIGHT rather than hardcoding panel geometry. See README.

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework  = arduino
monitor_speed = 115200
; The demo kit's USB bridge is a CH340, which negotiates 921600 and then fails
; the transfer ("Failed to communicate with the flash chip"). 460800 is the
; fastest rate it holds reliably; drop to 115200 if uploads still stall.
upload_speed  = 460800

; Reads .env (gitignored) and turns every entry into a -D define, so the WiFi
; password and RTT token never have to be written into tracked source.
extra_scripts = pre:scripts/load_env.py

lib_deps =
    zinggjm/GxEPD2 @ ^1.6.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    ; GxEPD2 draws in horizontal bands ("pages"). This caps the band buffer so the
    ; heap stays clear for the TLS session used by the two HTTPS fetches - the full
    ; 960x640 4-colour framebuffer would be 150 KB, which does not fit alongside WiFi.
    -D MAX_DISPLAY_BUFFER_SIZE=32768ul
    -D ENABLE_GxEPD2_GFX=0

; Bring-up build: same firmware, but setup() paints two test screens and stops
; without ever bringing up WiFi. Flash this first. It separates "the panel does
; not work" from "the fetch does not work", which are otherwise the same
; symptom - a board that stays blank.
;   pio run -e selftest -t upload
[env:selftest]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D SELFTEST=1
